<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="" />
  <meta name="theme-color" content="#0a0a0a" />

  <!-- Google Fonts: Playfair Display + Lato -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet"
  />

  <!-- Estilos -->
  <link rel="stylesheet" href="css/styles.css" />

  <title>Amarres de Amor</title>
</head>
<body>

  <!-- ======== LOADER ======== -->
  <div class="loader" id="loader">
    <div class="loader-spinner"></div>
  </div>

  <!-- ======== HEADER ======== -->
  <header class="header" id="header">
    <div class="container">
      <a href="#hero" class="logo">Amarres <span>de Amor</span></a>

      <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="nav" id="nav">
        <ul class="nav-list" id="nav-list">
          <!-- Renderizado por JS -->
        </ul>
      </nav>
    </div>
  </header>

  <!-- ======== CONTENIDO PRINCIPAL ======== -->
  <main id="app">

    <!-- HERO -->
    <section class="hero" id="hero">
      <!-- Renderizado por JS -->
    </section>

    <!-- SEPARADOR -->
    <div class="section-divider"><span>✦</span></div>

    <!-- SERVICIOS -->
    <section class="services" id="services">
      <div class="container">
        <h2 class="section-title">Nuestros Servicios</h2>
        <p class="section-subtitle">Rituales ancestrales adaptados a tu situación</p>
        <div class="services-grid">
          <!-- Renderizado por JS -->
        </div>
      </div>
    </section>

    <!-- SEPARADOR -->
    <div class="section-divider"><span>🌹</span></div>

    <!-- TESTIMONIOS -->
    <section class="testimonials" id="testimonials">
      <div class="container">
        <h2 class="section-title">Testimonios Reales</h2>
        <p class="section-subtitle">Miles de parejas reunidas en toda Latinoamérica</p>
      </div>
      <div class="container">
        <div class="testimonials-slider">
          <!-- Renderizado por JS -->
        </div>
      </div>
    </section>

    <!-- SEPARADOR -->
    <div class="section-divider"><span>✦</span></div>

    <!-- CONFIANZA / GARANTÍA -->
    <section class="trust" id="trust">
      <div class="container">
        <h2 class="section-title"><!-- Renderizado por JS --></h2>
        <p class="section-subtitle"><!-- Renderizado por JS --></p>
        <div class="trust-grid">
          <!-- Renderizado por JS -->
        </div>
      </div>
    </section>

    <!-- SEPARADOR -->
    <div class="section-divider"><span>🕯️</span></div>

    <!-- CONTACTO -->
    <section class="contact" id="contact">
      <div class="container">
        <div class="contact-content">
          <h2 class="section-title"><!-- Renderizado por JS --></h2>
          <p class="section-subtitle"><!-- Renderizado por JS --></p>
          <p class="contact-description"><!-- Renderizado por JS --></p>
          <div class="contact-details">
            <!-- Renderizado por JS -->
          </div>
          <div class="contact-cta">
            <!-- Renderizado por JS -->
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ======== BOTÓN FLOTANTE WHATSAPP ======== -->
  <div class="whatsapp-float" id="whatsapp-float">
    <!-- Renderizado por JS -->
  </div>

  <!-- ======== FOOTER ======== -->
  <footer class="footer" id="footer">
    <!-- Renderizado por JS -->
  </footer>

  <!-- JavaScript -->
  <script src="data/data.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
